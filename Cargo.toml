[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "examples/*"]
default-members = ["crates/nade"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100.0"
authors = ["potistudio <potistudio@proton.me>"]
license = "MIT"
publish = false

[profile.release]
codegen-units = 1
lto = true

# 未最適化のピクセル・グリフ処理はプレビューを実時間で回すには遅すぎる。
# 依存クレートは一度ビルドすれば使い回せるのでフル最適化し、自前クレートは
# ピクセルループを持つ nade_renderer / nade_effects のみ最適化して他はコンパイル速度を優先する。
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.nade_renderer]
opt-level = 3

[profile.dev.package.nade_media]
opt-level = 3

[profile.dev.package.nade_effects]
opt-level = 3

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
iced = { version = "0.14.0", features = ["advanced", "canvas", "svg"] }
log = "0.4.35"
nade_audio = { path = "crates/audio" }
nade_constants = { path = "crates/constants" }
nade_core = { path = "crates/core" }
nade_curve_editor_panel = { path = "crates/curve_editor_panel" }
nade_domain = { path = "crates/domain" }
nade_effects = { path = "crates/effects" }
nade_encoder = { path = "crates/encoder" }
nade_engine = { path = "crates/engine" }
nade_inspector_panel = { path = "crates/inspector_panel" }
nade_media = { path = "crates/media" }
nade_operators = { path = "crates/operators" }
nade_timeline_panel = { path = "crates/timeline_panel" }
nade_viewer_panel = { path = "crates/viewer_panel" }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
