[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "examples/*"]
default-members = ["crates/nade"]

[workspace.package]
authors = ["potistudio <potistudio@proton.me>"]
version = "0.0.1"
license = "MIT"
publish = false
edition = "2024"

[profile.release]
codegen-units = 1
lto = true

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
iced_core = { path = "vendor/iced_core" }
iced_winit = { path = "vendor/iced_winit" }
iced_widget = { path = "vendor/iced_widget" }

[workspace.dependencies]
log = "0.4.29"
iced = { version = "0.14", features = ["advanced", "canvas"] }
anyhow = "1.0.100"
env_logger = "0.11.8"
constants = { path = "crates/constants" }
nade-engine = { path = "crates/engine" }
nade-timeline = { path = "crates/timeline_panel" }
core = { path = "crates/core" }
inspector_panel = { path = "crates/inspector_panel" }
domain = { path = "crates/domain" }
operators = { path = "crates/operators" }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
effects = { path = "crates/effects" }
encoder = { path = "crates/encoder" }
