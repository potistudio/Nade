[package]
name = "nade"
description = "Built to Create. Programmed to Kill Adobe."
repository = "https://github.com/potistudio/Nade"
keywords = [
	"audio",
	"composition",
	"effect",
	"graphics",
	"linux",
	"macos",
	"video",
	"windows",
]
categories = ["multimedia::video", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "Nade"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
image = "0.25.8"
iced = { version = "0.14", features = [
	"wgpu",
	"image",
	"debug",
	"tokio",
	"canvas",
	"advanced",
] }
browser_panel = { path = "../browser_panel" }
constants = { workspace = true }
core = { workspace = true }
domain.workspace = true
panel_system = { path = "../panel_system" }
timeline_panel = { path = "../timeline_panel" }
inspector_panel = { path = "../inspector_panel" }
rayon = "1.10"
crossbeam-channel = "0.5.15"
tokio = { version = "1.48.0", features = ["full"] }
bytes = "1.11.0"
bytemuck = "1.16"
wgpu = "27.0.1"
iced_wgpu = "0.14"
renderer = { path = "../renderer" }
serde = "1.0.228"

[package.metadata.bundle]
name = "Nade"
identifier = "com.potistudio.nade"
icon = ["../../assets/icons/AppIcon.icns"]
category = "public.app-category.video"
copyright = "Copyright © 2026 POTI. All rights reserved."
short_description = "Built to Create. Programmed to Kill Adobe."
